# Gitleaks configuration for ab0t-quota
# https://github.com/gitleaks/gitleaks

title = "ab0t-quota gitleaks config"

[extend]
# Use the default gitleaks rules (~170) as a baseline. This is NOT implied —
# without it, only the custom rules below run and the built-in detectors for
# ghp_/gho_ tokens, AWS keys, Stripe keys etc. are OFF.
useDefault = true

# Additional custom rules for this project
[[rules]]
id = "generic-api-key-value"
description = "Detects generic API key assignments"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['\"][0-9a-zA-Z]{16,}['\"]'''
tags = ["key", "api"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "aws"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_?secret_?access_?key\s*[:=]\s*['\"][0-9a-zA-Z/+=]{40}['\"]'''
tags = ["key", "aws"]

[[rules]]
id = "generic-password"
description = "Detects hardcoded passwords"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['\"][^\s'"]{8,}['\"]'''
tags = ["password"]

[[rules]]
id = "private-key"
description = "Detects private keys"
regex = '''-----BEGIN\s*(RSA|EC|DSA|OPENSSH|PGP)?\s*PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "jwt-token"
description = "Detects JWT tokens"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["token", "jwt"]

[[rules]]
id = "redis-url-with-password"
description = "Redis connection string with password"
regex = '''redis://:[^@\s]{8,}@'''
tags = ["password", "redis"]

[[rules]]
id = "dynamodb-endpoint-with-creds"
description = "DynamoDB endpoint with embedded credentials"
# Matches what the description says: a URL whose userinfo carries credentials
# (scheme://user:pass@host) on a line mentioning dynamodb/ddb.
#
# The previous regex was '(?i)dynamodb.*endpoint.*(?:password|secret|key)\s*[:=]'.
# Because `.*` spans the whole line, any line containing "dynamodb", "endpoint"
# and a later `key=` matched — so `config_key="storage.dynamodb_endpoint"` in
# resolve.py:236 was flagged as a secret. It tested for the WORD "key", not for
# a credential. 26 `config_key=` call sites meant this would keep recurring.
regex = '''(?i)(?:dynamodb|ddb)[^\n]{0,120}?[a-z][a-z0-9+.\-]*://[^\s/@'"]+:[^\s/@'"]+@'''
tags = ["password", "aws"]

[[rules]]
id = "stripe-key"
description = "Stripe API Key"
regex = '''(?:sk|pk)_(test|live)_[0-9a-zA-Z]{24,}'''
tags = ["key", "stripe"]

[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+'''
tags = ["webhook", "slack"]

# Allowlist - paths and patterns that are safe to ignore
[allowlist]
description = "Global allowlist"
# NOTE: tests/ is deliberately NOT blanket-exempted. A real credential in a test
# file is still a leak; test-only synthetic values are allowlisted by regex below.
paths = [
    '''\.gitleaks\.toml$''',
    '''.*\.egg-info/.*''',
    '''__pycache__/.*''',
    '''\.pytest_cache/.*''',
    '''\.venv/.*''',
    '''\.mypy_cache/.*''',
    '''node_modules/.*''',
    '''dist/.*''',
    '''build/.*''',
    '''quota-config\.example\.json$''',
]
# Content-level allowlist: known false positives from the generic rules, matched
# on the secret text itself so they are exempt wherever they appear.
regexes = [
    # A docstring/prose line that names env-var identifiers, not a value.
    '''AB0T_AUTH_WEBHOOK_SECRET, AB0T_MESH_API_KEY''',
    # Synthetic credentials used only in tests (never real).
    '''(URL_PW|KWARG_PW|realpw|SECRETPW|unused-generic|GENERIC_DECOY|DECOY_[A-Za-z_0-9]+|decoy-[a-z.]+)''',
    # Obvious placeholder Slack webhook used in a dispatcher unit test.
    '''hooks\.slack\.com/services/T123/B456/abc''',
    # Prose naming env-var identifiers (not values).
    '''`?AB0T_MESH_API_KEY`? env var''',
]
# Known false positives in HISTORY (commit 933ebb04, 2026-04-28), exempted by
# exact fingerprint so any NEW occurrence in a new commit is NOT silenced:
#   __main__.py:14  — docstring naming env-var identifiers
#   CONTEXT.md:114  — a prod org UUID in prose (not a credential); that ticket is
#                     now gitignored/untracked, but the blob persists in history.
commits = [
    "933ebb04845146bb9f14dc455c1cda6f15a97e7f",
]
# Stopwords keep the generic-* rules from firing on obvious non-secrets.
stopwords = [
    "example", "changeme", "placeholder", "your-", "redacted", "REDACTED",
]
